<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Haven: Thank You</title>
    
    <!-- FontAwesome & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/contactthanks.css">

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="../media/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../media/favicon.svg" />
    <link rel="shortcut icon" href="../media/favicon.ico" />
</head>
<body>

    <!-- Header Navigation -->
    <div class="sub-header">
        <nav>
            <a href="../index.html"><img src="../media/animehavenlogo1.png" alt="Anime Haven Logo"></a>
            <div class="nav-links" id="navLinks">
                <i class="fa-solid fa-xmark" onclick="hideMenu()"></i>
                <ul>
                    <li><a href="../index.html">HOME</a></li>
                    <li><a href="../pages/about.html">ABOUT</a></li>
                    <li><a href="../pages/contact.html">CONTACT</a></li>
                </ul>
            </div>
            <i class="fa-solid fa-bars" onclick="showMenu()"></i>
        </nav>
    </div>

    <!-- Thank You Card Container -->
    <div class="thank-container">
        <div class="thank-card">
            <div class="check-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2>THANK YOU!</h2>
            <p>Your message has been received. We'll get back to you as soon as possible.</p>
            
            <!-- Guaranteed JS Redirect -->
            <button class="home-btn" onclick="window.location.href='../index.html'">RETURN HOME</button>
        </div>
    </div>

    <!-- Mobile Navigation Script -->
    <script>
        var navLinks = document.getElementById("navLinks");
        function showMenu(){
            navLinks.style.right = "0";
        }
        function hideMenu(){
            navLinks.style.right = "-200px";
        }
    </script>
</body>
</html>
